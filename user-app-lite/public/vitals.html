<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>บันทึกค่าสัญญาณชีพ — MOPH Meet</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<style>
  body { background: #f0faf4; }
  .card-header { background: #1b7a43; color: #fff; }
  .badge-online { background: #1b7a43; }
  .metric-label { font-size: 0.78rem; color: #6b7280; }
  .metric-val   { font-size: 1.4rem; font-weight: 700; color: #1b7a43; }
  #vitalsTable th { font-size: 0.8rem; }
</style>
</head>
<body>
<div class="container py-4" style="max-width:760px">
  <div class="d-flex align-items-center gap-2 mb-3">
    <a href="/" class="text-decoration-none text-secondary">← กลับหน้าหลัก</a>
  </div>

  <div class="card shadow-sm mb-4">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>🩺 บันทึกค่าสัญญาณชีพ (TOR 4.10.5)</span>
      <span id="roomLabel" class="badge bg-white text-dark" style="display:none"></span>
    </div>
    <div class="card-body">
      <div class="row g-3 mb-3">
        <div class="col-6 col-md-4">
          <label class="metric-label">น้ำหนัก (kg)</label>
          <input class="form-control" id="v_weight" type="number" step="0.1" placeholder="เช่น 65.5">
        </div>
        <div class="col-6 col-md-4">
          <label class="metric-label">ส่วนสูง (cm)</label>
          <input class="form-control" id="v_height" type="number" step="0.1" placeholder="เช่น 170">
        </div>
        <div class="col-6 col-md-4">
          <label class="metric-label">อุณหภูมิ (°C)</label>
          <input class="form-control" id="v_temp" type="number" step="0.1" placeholder="เช่น 37.0">
        </div>
        <div class="col-6 col-md-4">
          <label class="metric-label">SpO₂ (%)</label>
          <input class="form-control" id="v_spo2" type="number" step="0.1" placeholder="เช่น 98">
        </div>
        <div class="col-6 col-md-4">
          <label class="metric-label">ความดัน SYS (mmHg)</label>
          <input class="form-control" id="v_sys" type="number" placeholder="เช่น 120">
        </div>
        <div class="col-6 col-md-4">
          <label class="metric-label">ความดัน DIA (mmHg)</label>
          <input class="form-control" id="v_dia" type="number" placeholder="เช่น 80">
        </div>
        <div class="col-6 col-md-4">
          <label class="metric-label">อัตราการหายใจ RR (/min)</label>
          <input class="form-control" id="v_rr" type="number" placeholder="เช่น 16">
        </div>
        <div class="col-6 col-md-4">
          <label class="metric-label">ชีพจร Pulse (/min)</label>
          <input class="form-control" id="v_pr" type="number" placeholder="เช่น 72">
        </div>
        <div class="col-6 col-md-4">
          <label class="metric-label">น้ำตาล Glucose (mg/dL)</label>
          <input class="form-control" id="v_glucose" type="number" placeholder="เช่น 90">
        </div>
        <div class="col-6 col-md-4">
          <label class="metric-label">NST FHR (bpm)</label>
          <input class="form-control" id="v_fhr" type="number" placeholder="เช่น 140">
        </div>
        <div class="col-6 col-md-4">
          <label class="metric-label">NST TOCO (mmHg)</label>
          <input class="form-control" id="v_toco" type="number" placeholder="เช่น 10">
        </div>
        <div class="col-6 col-md-4">
          <label class="metric-label">MAP (mmHg)</label>
          <input class="form-control" id="v_map" type="number" placeholder="เช่น 90">
        </div>
      </div>
      <div class="row g-2 mb-2">
        <div class="col-md-6">
          <label class="metric-label">roomId (ห้องตรวจ — ถ้ามี)</label>
          <input class="form-control" id="roomId" placeholder="ใส่ room id หรือเว้นว่าง">
        </div>
        <div class="col-md-6">
          <label class="metric-label">หมายเหตุ / อุปกรณ์</label>
          <input class="form-control" id="deviceId" placeholder="เช่น BP-001 (optional)">
        </div>
      </div>
      <button class="btn btn-success w-100 mt-2" onclick="saveVitals()">💾 บันทึกค่าสัญญาณชีพ</button>
      <div id="msg" class="mt-2"></div>
    </div>
  </div>

  <!-- ตารางค่าที่บันทึก -->
  <div class="card shadow-sm">
    <div class="card-header d-flex justify-content-between">
      <span>📋 ประวัติค่าที่บันทึก</span>
      <button class="btn btn-sm btn-outline-light" onclick="loadVitals()">🔄 โหลดใหม่</button>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-sm table-striped mb-0" id="vitalsTable">
          <thead><tr>
            <th>เวลา</th><th>ค่า</th><th>metric</th><th>unit</th><th>source</th>
          </tr></thead>
          <tbody id="vitalsBody"><tr><td colspan="5" class="text-center text-muted py-3">—</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
const FIELDS = [
  { id:'v_weight',  metric:'weight',  unit:'kg',    deviceType:'scale' },
  { id:'v_height',  metric:'height',  unit:'cm',    deviceType:'scale' },
  { id:'v_temp',    metric:'temp',    unit:'°C',    deviceType:'thermometer' },
  { id:'v_spo2',    metric:'spo2',    unit:'%',     deviceType:'pulseOximeter' },
  { id:'v_sys',     metric:'sys',     unit:'mmHg',  deviceType:'bloodPressure' },
  { id:'v_dia',     metric:'dia',     unit:'mmHg',  deviceType:'bloodPressure' },
  { id:'v_map',     metric:'map',     unit:'mmHg',  deviceType:'bloodPressure' },
  { id:'v_rr',      metric:'rr',      unit:'/min',  deviceType:'manual' },
  { id:'v_pr',      metric:'pr',      unit:'/min',  deviceType:'pulseOximeter' },
  { id:'v_glucose', metric:'glucose', unit:'mg/dL', deviceType:'bgm' },
  { id:'v_fhr',     metric:'fhr',     unit:'bpm',   deviceType:'nst' },
  { id:'v_toco',    metric:'toco',    unit:'mmHg',  deviceType:'nst' },
];

function getToken() {
  const m = document.cookie.match(/(?:^|;\s*)token=([^;]+)/);
  return m ? m[1] : null;
}

async function saveVitals() {
  const token  = getToken();
  const roomId = document.getElementById('roomId').value.trim() || null;
  const devId  = document.getElementById('deviceId').value.trim() || null;
  const records = [];

  for (const f of FIELDS) {
    const v = document.getElementById(f.id).value.trim();
    if (v === '') continue;
    records.push({ roomId, patientKey: null, deviceId: devId,
      deviceType: f.deviceType, metric: f.metric, value: v, unit: f.unit, source: 'manual' });
  }

  if (records.length === 0) {
    document.getElementById('msg').innerHTML = '<div class="alert alert-warning py-1">กรุณากรอกอย่างน้อย 1 ค่า</div>';
    return;
  }

  const res = await fetch('/api/vitals/batch', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
    body: JSON.stringify(records),
  });
  if (res.ok) {
    document.getElementById('msg').innerHTML = `<div class="alert alert-success py-1">✅ บันทึก ${records.length} ค่าเรียบร้อย</div>`;
    FIELDS.forEach(f => { document.getElementById(f.id).value = ''; });
    if (roomId) loadVitals();
  } else {
    const d = await res.json().catch(() => ({}));
    document.getElementById('msg').innerHTML = `<div class="alert alert-danger py-1">❌ ${d.message || res.status}</div>`;
  }
}

async function loadVitals() {
  const token  = getToken();
  const roomId = document.getElementById('roomId').value.trim();
  if (!roomId) return;
  document.getElementById('roomLabel').textContent = 'ห้อง: ' + roomId;
  document.getElementById('roomLabel').style.display = '';
  const res = await fetch(`/api/vitals?roomId=${encodeURIComponent(roomId)}`, {
    headers: { Authorization: `Bearer ${token}` }
  });
  if (!res.ok) return;
  const rows = await res.json();
  const tbody = document.getElementById('vitalsBody');
  if (!rows.length) { tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">ยังไม่มีข้อมูล</td></tr>'; return; }
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td>${r.recorded_at ? r.recorded_at.slice(0,16).replace('T',' ') : '—'}</td>
      <td><strong>${r.value}</strong></td>
      <td>${r.metric}</td>
      <td>${r.unit || '—'}</td>
      <td><span class="badge bg-secondary">${r.source}</span></td>
    </tr>`).join('');
}

// Auto-load if roomId is in URL param
const urlRoom = new URLSearchParams(location.search).get('roomId');
if (urlRoom) {
  document.getElementById('roomId').value = urlRoom;
  loadVitals();
}
</script>
</body>
</html>
